<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MANJI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
    background:
      radial-gradient(600px 320px at 50% 38%, rgba(255, 107, 53, 0.14), transparent 70%),
      radial-gradient(800px 500px at 50% 120%, rgba(120, 60, 220, 0.08), transparent 70%),
      #0a0a0a;
    animation: stageIn 0.6s ease-out both;
  }
  @keyframes stageIn { from { opacity: 0; } to { opacity: 1; } }
  .logo {
    width: 120px; height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 8px 32px rgba(255, 107, 53, 0.35));
    animation: logoIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.92) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .wordmark {
    margin-top: 20px;
    font-size: 34px; font-weight: 800;
    letter-spacing: 10px; text-indent: 10px;
    background: linear-gradient(135deg, #ff6b35, #f7931e);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: fadeUp 0.8s ease-out 0.15s both;
  }
  .tagline {
    margin-top: 10px;
    font-size: 14px; font-weight: 400;
    letter-spacing: 2.5px; text-indent: 2.5px;
    color: rgba(255, 255, 255, 0.65);
    animation: fadeUp 0.8s ease-out 0.3s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .journey {
    margin-top: 22px;
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.35);
    animation: fadeUp 0.8s ease-out 0.45s both;
  }
  .journey .dot { color: rgba(255, 107, 53, 0.6); }
  .loader { margin-top: 26px; width: 200px; animation: fadeUp 0.8s ease-out 0.5s both; }
  .track {
    height: 3px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .bar {
    height: 100%; width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff6b35, #f7931e);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(280%); }
  }
  .status {
    margin-top: 12px;
    font-size: 11px; letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.4);
    min-height: 16px;
    text-align: center;
  }
  .status.error { color: #f87171; }
  @media (prefers-reduced-motion: reduce) {
    .stage, .logo, .wordmark, .tagline, .journey, .loader { animation-duration: 0.01s; }
    .bar { animation: none; width: 100%; }
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="logo" src="./assets/logo.png" alt="MANJI" draggable="false" />
    <div class="wordmark">MANJI</div>
    <div class="tagline">From imagination to animation.</div>
    <div class="journey">
      <span>IDEA</span><span class="dot">→</span><span>STORY</span><span class="dot">→</span><span>CHARACTER</span><span class="dot">→</span><span>SCENE</span><span class="dot">→</span><span>ANIMATION</span>
    </div>
    <div class="loader" id="loader"><div class="track"><div class="bar"></div></div></div>
    <div class="status" id="status">Preparing your studio…</div>
  </div>
  <script>
    // Status + error states are driven from the main process.
    // Exposed deliberately on window for executeJavaScript calls.
    window.__manjiSplash = {
      setStatus(text) {
        var el = document.getElementById('status');
        if (el) { el.textContent = text; el.classList.remove('error'); }
      },
      setError(text) {
        var el = document.getElementById('status');
        var loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
        if (el) { el.textContent = text; el.classList.add('error'); }
      }
    };
  </script>
</body>
</html>
