name: Build Windows Installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - run: npm ci
      - run: npm run build
        env: {VITE_API_URL: https://manji-api.onrender.com}
      - run: npx electron-builder --win --publish never
        env: {GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MANJI ${{ github.ref_name }}
          body: |
            ## MANJI ${{ github.ref_name }} — Windows Desktop App
            ### Downloads
            - **NSIS Installer**: `Manji Studio Setup *.exe`
            - **Portable**: `Manji Studio *.exe`
            ### Install
            1. Download the Setup exe, run it, follow the wizard
            2. Launch "Manji Studio" from Start Menu
            ### Requirements
            - Windows 10 1903+ (64-bit), 8 GB RAM, internet for AI
          files: |
            release/*.exe
          generate_release_notes: true
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
